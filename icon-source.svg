<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="#111827"/>

  <!-- cuerpo de la serpiente, forma de "S" amigable -->
  <rect x="96" y="320" width="96" height="96" rx="24" fill="url(#bodyGrad)"/>
  <rect x="176" y="320" width="96" height="96" rx="24" fill="url(#bodyGrad)"/>
  <rect x="256" y="240" width="96" height="96" rx="24" fill="url(#bodyGrad)"/>
  <rect x="256" y="160" width="96" height="96" rx="24" fill="#22c55e"/>

  <!-- ojo en la cabeza, para que se vea amigable -->
  <circle cx="320" cy="196" r="10" fill="#111827"/>

  <!-- comida: manzana naranja (recompensa) con hojita verde -->
  <circle cx="152" cy="176" r="40" fill="#fb923c"/>
  <rect x="146" y="124" width="12" height="22" rx="6" fill="#92400e"/>
  <path d="M158 132 Q182 124 180 148 Q162 148 158 132 Z" fill="#4ade80"/>

  <!-- chispa dorada de logro -->
  <circle cx="400" cy="340" r="14" fill="#facc15"/>
